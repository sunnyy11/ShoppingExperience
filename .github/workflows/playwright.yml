name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://automationexercise.com

jobs:
  quality:
    name: Lint, Typecheck, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Prettier check
        run: npx prettier --check .

  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      AUTOMATION_EXERCISE_TEST_EMAIL_1: ${{ secrets.AUTOMATION_EXERCISE_TEST_EMAIL_1 }}
      AUTOMATION_EXERCISE_TEST_PASSWORD_1: ${{ secrets.AUTOMATION_EXERCISE_TEST_PASSWORD_1 }}
      AUTOMATION_EXERCISE_TEST_EMAIL_2: ${{ secrets.AUTOMATION_EXERCISE_TEST_EMAIL_2 }}
      AUTOMATION_EXERCISE_TEST_PASSWORD_2: ${{ secrets.AUTOMATION_EXERCISE_TEST_PASSWORD_2 }}
      AUTOMATION_EXERCISE_TEST_EMAIL_3: ${{ secrets.AUTOMATION_EXERCISE_TEST_EMAIL_3 }}
      AUTOMATION_EXERCISE_TEST_PASSWORD_3: ${{ secrets.AUTOMATION_EXERCISE_TEST_PASSWORD_3 }}
      AUTOMATION_EXERCISE_TEST_EMAIL_4: ${{ secrets.AUTOMATION_EXERCISE_TEST_EMAIL_4 }}
      AUTOMATION_EXERCISE_TEST_PASSWORD_4: ${{ secrets.AUTOMATION_EXERCISE_TEST_PASSWORD_4 }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (traces, screenshots, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            blob-report/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-shard-${{ matrix.shard }}
          path: results.xml
          retention-days: 7

  merge-reports:
    name: Merge Reports
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: blob-reports

      - name: Copy blob reports to top level
        run: find blob-reports -path "*/blob-report/*.zip" -exec cp {} blob-reports/ \;

      - name: Merge reports
        run: npx playwright merge-reports blob-reports --reporter html

      - name: Download JUnit results
        uses: actions/download-artifact@v4
        with:
          path: junit-results
          pattern: junit-results-shard-*

      - name: Merge JUnit results
        run: |
          mkdir -p merged-junit
          find junit-results -name "results.xml" -exec cp {} merged-junit/ \;
          npx playwright merge-reports merged-junit --reporter junit --output merged-junit/merged-results.xml

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload merged JUnit results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: merged-junit/merged-results.xml
          retention-days: 7
